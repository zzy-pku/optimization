[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ougd-hessian"
version = "0.1.0"
description = "Distributed Transformer training and matrix-free M1 Hessian experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
data = ["datasets>=3", "transformers>=4.45", "sentencepiece"]
test = ["pytest>=8"]
reports = ["pyarrow>=14"]

[tool.setuptools.packages.find]
include = ["ougd*"]
